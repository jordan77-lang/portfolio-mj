<button
  type="button"
  class="theme-toggle-btn inline-flex items-center justify-center p-1 rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
  onclick="toggleTheme()"
  aria-label="Toggle color theme"
>
  <i
    class="fas fa-sun theme-toggle text-blue-500 hover:text-blue-700 dark:text-yellow-300 dark:hover:text-yellow-500 cursor-pointer text-lg mr-9 sm:mr-0"
    aria-hidden="true"
  ></i>
</button>
