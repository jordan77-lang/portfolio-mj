  aboutme:
    title: About Me
    icon: fas fa-user
    description: |
      I'm a PhD student in ASU's GAME School and a Senior Curriculum Designer for Dreamscape Learn, where I design immersive AR and VR learning experiences that make complex ideas tangible through story, mission, and applied practice. I also serve as a Faculty Associate in the Mary Lou Fulton Teachers College Learning Design and Technologies program, supporting graduate students as they grow as learning designers.

      After twenty-four years teaching engineering, robotics, and cybersecurity in Arizona public schools, my work now spans doctoral research, university curriculum design, and faculty development—always grounded in the belief that great learning is clear, engaging, and built for every learner.

      Whether launching student payloads toward the stratosphere, crafting VR mission curricula, or mentoring emerging designers, I aim to create experiences that invite curiosity, connection, and meaningful understanding.

